name: LeetCode Daily Auto-Fetch

on:
  schedule:
    - cron: '0 16 * * *' # 北京时间 00:00
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 核心开关：只有当用户在仓库配置了此变量，任务才会执行
    if: vars.ENABLE_AUTO_FETCH == 'true'

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: 3. Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          
          pip install requests playwright
          playwright install chromium

      - name: 4. Run Crawler Script
        run: |
          python leetcode_daily.py

      - name: 5. Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Update daily problem $(date +'%Y-%m-%d')"
            git pull origin main --rebase
            git push origin main
          else
            echo "No changes detected, skipping."
          fi